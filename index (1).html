<style>
  body { font-family: 'Segoe UI', Inter, system-ui, sans-serif; background:#0A0A0A; color:#F1F1F1; }
  .fade-up { animation: fadeUp .6s ease-out forwards; opacity: 0; transform: translateY(12px); }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .card-hover { transition: box-shadow .2s, transform .2s, border-color .2s; }
  .card-hover:hover { box-shadow: 0 8px 24px rgba(212,175,55,.12); transform: translateY(-2px); border-color:#D4AF37; }
  .gold-text { background: linear-gradient(90deg, #D4AF37, #FFD700); -webkit-background-clip: text; background-clip:text; color: transparent; }
  #toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 100; display: flex; flex-direction: column; gap: .5rem; max-width: 22rem; }
  .toast { background: #141414; border: 1px solid #D4AF37; color: #F1F1F1; padding: .75rem 1rem; border-radius: .5rem; font-size: .875rem; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: toastIn .25s ease-out forwards; }
  .toast.toast-out { animation: toastOut .25s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(12px); } }
</style>

/* ---------------- Avatars ---------------- */
function initials(name) {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0] || "") + (parts[1]?.[0] || "")).toUpperCase();
}
function avatarImg(user, size) {
  size = size || "h-10 w-10";
  if (user && user.avatar) {
    return `<img src="${user.avatar}" alt="${user.fullName || 'Avatar'}" class="${size} rounded-full object-cover border border-line shrink-0" />`;
  }
  const label = initials(user ? (user.fullName || user.company) : "?");
  return `<div class="${size} rounded-full bg-primary/20 border border-primary text-accent flex items-center justify-center font-bold shrink-0" style="font-size: 0.9em;">${label}</div>`;
}
function handleAvatarChange(input, previewId) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const user = currentUser();
    if (!user) return;
    user.avatar = reader.result;
    saveDB();
    const preview = document.getElementById(previewId);
    if (preview) preview.innerHTML = avatarImg(user, preview.dataset.size || "h-20 w-20");
    const navAvatar = document.getElementById("nav-avatar");
    if (navAvatar) navAvatar.innerHTML = avatarImg(user, "h-9 w-9");
    showToast("Profile picture updated.");
  };
  reader.readAsDataURL(file);
}
function avatarUploadField(user, previewId, size) {
  size = size || "h-20 w-20";
  return `
  <div class="flex items-center gap-4">
    <span id="${previewId}" data-size="${size}">${avatarImg(user, size)}</span>

}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

let chatMediaRecorder = null;
let chatAudioChunks = [];
let chatRecordingContext = null;

function sendChatMessageRaw(employerId, studentId, jobId, type, text, audio) {
  const user = currentUser();
  if (!user) return;
  db.messages.push({
    id: "m" + Date.now() + Math.random().toString(36).slice(2, 7),
    employerId, studentId, jobId: jobId || null,
    senderId: user.id, type, text: text || null, audio: audio || null,
    createdAt: Date.now()
  });
  saveDB();
  render();
}

function sendChatMessage(e, employerId, studentId, jobId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const text = (fd.get("text") || "").trim();
  if (!text) return;
  sendChatMessageRaw(employerId, studentId, jobId, "text", text, null);
}

function toggleVoiceRecording(employerId, studentId, jobId) {
  const btn = document.getElementById("voice-record-btn");
  if (chatMediaRecorder && chatMediaRecorder.state === "recording") {
    chatMediaRecorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
    showToast("Voice recording isn't supported in this browser.");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    chatAudioChunks = [];
    chatRecordingContext = { employerId, studentId, jobId };
    chatMediaRecorder = new MediaRecorder(stream);
    chatMediaRecorder.ondataavailable = ev => { if (ev.data && ev.data.size > 0) chatAudioChunks.push(ev.data); };
    chatMediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (btn) { btn.classList.remove("bg-red-500", "animate-pulse", "border-red-500"); btn.textContent = "🎤"; }
      if (!chatAudioChunks.length) return;
      const blob = new Blob(chatAudioChunks, { type: "audio/webm" });
      const reader = new FileReader();
      reader.onload = () => {
        const ctx = chatRecordingContext;
        sendChatMessageRaw(ctx.employerId, ctx.studentId, ctx.jobId, "audio", null, reader.result);
      };
      reader.readAsDataURL(blob);
    };
    chatMediaRecorder.start();
    if (btn) { btn.classList.add("bg-red-500", "animate-pulse", "border-red-500"); btn.textContent = "⏹"; }
    showToast("Recording voice message... click again to stop.");
  }).catch(() => {
    showToast("Microphone access was denied or is unavailable.");
  });
}

/* ---------------- Profile completion ---------------- */
function isProfileComplete(user) {
  if (!user) return false;
  if (user.role === "student") {
    return !!(user.university && user.course && user.bio && user.skills && user.skills.length > 0);
  }
  return !!(user.company && user.companyDescription && user.industry);
}

Responsibilities:
- Collaborate with the team on day-to-day tasks related to ${title}

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < String(str).length; i++) {
    h = (Math.imul(31, h) + String(str).charCodeAt(i)) | 0;
  }
  return h;
}

/* ---------------- Toast notifications ---------------- */
function showToast(message) {
  const container = document.getElementById("toast-container");
  if (!container) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => {
    el.classList.add("toast-out");
    setTimeout(() => el.remove(), 250);
  }, 3200);
}

function opportunitiesPage() {
  const params = new URLSearchParams(window.location.hash.split("?")[1] || "");
  const category = params.get("category");
  const subcategory = params.get("subcategory");
  const remote = params.get("remote");

  let jobs = db.jobs.slice();
  if (category) jobs = jobs.filter(j => j.category === category);
  if (subcategory) jobs = jobs.filter(j => j.subcategory === subcategory);
  if (remote === "true") jobs = jobs.filter(j => j.remote);

  // Featured (premium employer) jobs first
  jobs.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

  const isActive = (val) => category === val ? "border-primary text-accent bg-primary/10" : "border-line hover:border-primary hover:text-accent";

  return `
  ${navbar()}
  <main class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold">Opportunities</h1>
    <p class="mt-2 text-gray-400">Freelance gigs, internships, part-time jobs, Worker Jobs, competitions, scholarships, and startup programs — all in one place.</p>
    <p class="mt-1 text-sm text-accent">🔧🎓 New: Worker Jobs now covers both no-certificate menial work and certificate/degree white-collar roles — so everyone can find something, certificate or not.</p>

    <div class="mt-6 flex flex-wrap gap-2 text-sm font-medium">
      <a href="#/opportunities" class="rounded-full border ${!category ? "border-primary text-accent bg-primary/10" : "border-line hover:border-primary hover:text-accent"} px-4 py-1.5">All</a>
      ${Object.entries(CATEGORY_LABELS).map(([val, label]) => `
        <a href="#/opportunities?category=${val}" class="rounded-full border ${isActive(val)} px-4 py-1.5">${label}</a>`).join("")}
      <a href="#/opportunities?remote=true" class="rounded-full border border-line px-4 py-1.5 hover:border-primary hover:text-accent">Remote only</a>
    </div>

    ${category === "worker" ? `
    <div class="mt-4 flex flex-wrap gap-2 text-sm font-medium">
      <a href="#/opportunities?category=worker" class="rounded-full border ${!subcategory ? "border-primary text-accent bg-primary/10" : "border-line hover:border-primary hover:text-accent"} px-4 py-1.5">All Worker Jobs</a>
      ${Object.entries(WORKER_SUBCATEGORIES).map(([val, sc]) => `
        <a href="#/opportunities?category=worker&subcategory=${val}" class="rounded-full border ${subcategory === val ? "border-primary text-accent bg-primary/10" : "border-line hover:border-primary hover:text-accent"} px-4 py-1.5">${sc.icon} ${sc.label} — ${sc.tagline}</a>`).join("")}
    </div>` : ""}

    <div class="mt-8 grid md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${jobs.length ? jobs.map(j => `
        <div class="card-hover rounded-lg border ${j.featured ? "border-primary" : "border-line"} bg-panel p-5">
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-semibold">${j.title}</h3>
            ${j.featured ? `<span class="shrink-0 rounded-full bg-primary text-black text-xs font-bold px-2 py-0.5">⭐ Featured</span>` : ""}
          </div>
          <p class="mt-1 text-sm text-gray-400 line-clamp-2">${j.description}</p>
          <div class="mt-3 flex flex-wrap gap-2 text-xs">
            <span class="rounded-full bg-primary/10 text-accent px-3 py-1 font-medium">${CATEGORY_LABELS[j.category]}</span>
            ${j.subcategory && WORKER_SUBCATEGORIES[j.subcategory] ? `<span class="rounded-full bg-ink border border-line px-3 py-1">${WORKER_SUBCATEGORIES[j.subcategory].icon} ${WORKER_SUBCATEGORIES[j.subcategory].tagline}</span>` : ""}
            <span class="rounded-full bg-ink border border-line px-3 py-1">${j.location}</span>
            ${j.remote ? `<span class="rounded-full bg-primary/10 text-accent px-3 py-1 font-medium">Remote</span>` : ""}
            <span class="rounded-full bg-ink border border-line px-3 py-1">${j.salary}</span>
          </div>
          ${currentUser()?.role === "student" ? `
            <button onclick="applyToJob('${j.id}')" class="mt-4 w-full h-9 rounded-md bg-primary text-black text-sm font-semibold hover:bg-accent">
              ${db.applications.find(a => a.jobId === j.id && a.studentId === currentUser().id) ? "Applied ✓" : "Apply now"}
            </button>` : ""}
        </div>`).join("") : `<p class="text-gray-400">No opportunities found for this filter.</p>`}
    </div>
  </main>
  ${footer()}`;
}

function premiumBadge(user) {
  const plan = PLANS[user.plan || "free"];

  return `<span class="inline-flex items-center gap-1 rounded-full bg-primary text-black text-xs font-bold px-2 py-0.5">${plan.badge}</span>`;
}

/* ---------------- Escrow ---------------- */
function escrowStatusBadge(status) {
  if (status === "funded") return `<span class="rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 text-xs font-medium px-3 py-1">🔒 In Escrow</span>`;
  if (status === "released") return `<span class="rounded-full bg-primary/10 text-accent text-xs font-medium px-3 py-1">✅ Released to freelancer</span>`;
  if (status === "withdrawn") return `<span class="rounded-full bg-green-500/10 text-green-400 border border-green-500/30 text-xs font-medium px-3 py-1">💰 Withdrawn</span>`;
  return `<span class="rounded-full bg-line text-gray-300 text-xs font-medium px-3 py-1">${status}</span>`;
}

/* ---------------- Chat page ---------------- */
function chatPage() {
  const user = currentUser();
  if (!user) { navigate("#/login"); return ""; }

  const params = new URLSearchParams(window.location.hash.split("?")[1] || "");
  let peerId = params.get("peer");
  const jobIdParam = params.get("job");

  // Gather everyone this user could talk to: existing message threads,
  // plus anyone connected via an application (so a fresh chat can be started).
  const partnerIds = new Set();
  db.messages.forEach(m => {
    if (m.employerId === user.id) partnerIds.add(m.studentId);
    if (m.studentId === user.id) partnerIds.add(m.employerId);
  });
  if (user.role === "employer") {
    db.jobs.filter(j => j.employerId === user.id).forEach(j => {
      db.applications.filter(a => a.jobId === j.id).forEach(a => partnerIds.add(a.studentId));
    });
  } else {
    db.applications.filter(a => a.studentId === user.id).forEach(a => {
      const job = db.jobs.find(j => j.id === a.jobId);
      if (job) partnerIds.add(job.employerId);
    });
  }
  partnerIds.delete(user.id);

  if (!peerId && partnerIds.size) peerId = [...partnerIds][0];

  const conversations = [...partnerIds].map(pid => {
    const partner = db.users.find(u => u.id === pid);
    if (!partner) return null;
    const employerId = user.role === "employer" ? user.id : pid;
    const studentId = user.role === "student" ? user.id : pid;
    const pairMsgs = db.messages.filter(m => m.employerId === employerId && m.studentId === studentId)
      .sort((a, b) => b.createdAt - a.createdAt);
    return { partner, last: pairMsgs[0] || null };
  }).filter(Boolean).sort((a, b) => (b.last?.createdAt || 0) - (a.last?.createdAt || 0));

  const peer = peerId ? db.users.find(u => u.id === peerId) : null;
  const employerId = user.role === "employer" ? user.id : peerId;
  const studentId = user.role === "student" ? user.id : peerId;
  const linkedApp = peer ? db.applications.find(a =>
    a.studentId === studentId && db.jobs.some(j => j.id === a.jobId && j.employerId === employerId)
  ) : null;
  const jobId = jobIdParam || (linkedApp ? linkedApp.jobId : null);
  const job = jobId ? db.jobs.find(j => j.id === jobId) : null;

  const thread = peer ? db.messages.filter(m => m.employerId === employerId && m.studentId === studentId)
    .sort((a, b) => a.createdAt - b.createdAt) : [];

  return `
  ${navbar()}
  <main class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold">Messages</h1>
    <p class="mt-1 text-sm text-gray-400">Chat directly with ${user.role === "employer" ? "applicants" : "employers"} — text or voice notes.</p>
    <div class="mt-6 grid md:grid-cols-3 gap-4">
      <div class="rounded-lg border border-line bg-panel md:col-span-1 max-h-[34rem] overflow-y-auto">
        ${conversations.length ? conversations.map(c => `
          <a href="#/chat?peer=${c.partner.id}" class="flex items-center gap-3 p-3 border-b border-line hover:bg-ink/60 ${peer && peer.id === c.partner.id ? "bg-ink/60" : ""}">
            ${avatarImg(c.partner, "h-10 w-10")}
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium truncate">${c.partner.fullName || c.partner.company || "User"}</p>
              <p class="text-xs text-gray-500 truncate">${c.last ? (c.last.type === "audio" ? "🎤 Voice message" : escapeHtml(c.last.text || "")) : "No messages yet — say hi"}</p>
            </div>
          </a>`).join("") : `<p class="p-4 text-sm text-gray-400">No conversations yet. Message an applicant or employer from a job listing to get started.</p>`}
      </div>
      <div class="rounded-lg border border-line bg-panel md:col-span-2 flex flex-col h-[34rem]">
        ${peer ? `
          <div class="flex items-center gap-3 p-4 border-b border-line">
            ${avatarImg(peer, "h-10 w-10")}
            <div class="min-w-0 flex-1">
              <p class="font-medium truncate">${peer.fullName || peer.company || "User"}</p>
              <p class="text-xs text-gray-500 truncate">${peer.role === "employer" ? (peer.company || "Employer") : (peer.course || "Student")}${job ? " · Re: " + job.title : ""}</p>
            </div>
          </div>
          <div id="chat-thread" class="flex-1 overflow-y-auto p-4 space-y-3">
            ${thread.length ? thread.map(m => `
              <div class="flex ${m.senderId === user.id ? "justify-end" : "justify-start"}">
                <div class="max-w-[75%] rounded-lg px-3 py-2 text-sm ${m.senderId === user.id ? "bg-primary text-black" : "bg-ink border border-line text-white"}">
                  ${m.type === "audio" ? `<audio controls src="${m.audio}" class="w-56 max-w-full"></audio>` : `<p class="whitespace-pre-wrap break-words">${escapeHtml(m.text || "")}</p>`}
                  <p class="mt-1 text-[10px] opacity-60">${new Date(m.createdAt).toLocaleString()}</p>
                </div>
              </div>`).join("") : `<p class="text-sm text-gray-400">Say hello 👋</p>`}
          </div>
          <form onsubmit="sendChatMessage(event, '${employerId}', '${studentId}', ${jobId ? `'${jobId}'` : "null"})" class="p-3 border-t border-line flex items-center gap-2">
            <button type="button" id="voice-record-btn" onclick="toggleVoiceRecording('${employerId}', '${studentId}', ${jobId ? `'${jobId}'` : "null"})" title="Record a voice message" class="h-10 w-10 shrink-0 rounded-full border border-line hover:border-primary flex items-center justify-center transition-colors">🎤</button>
            <input name="text" autocomplete="off" placeholder="Type a message..." class="flex-1 h-10 rounded-md border border-line bg-ink px-3 text-sm text-white" />
            <button type="submit" class="h-10 px-4 rounded-md bg-primary text-black text-sm font-semibold hover:bg-accent">Send</button>
          </form>` : `<div class="flex-1 flex items-center justify-center text-sm text-gray-400 p-6 text-center">Select a conversation on the left, or message someone from an application or applicant list to start chatting.</div>`}
      </div>
    </div>
  </main>
  ${footer()}`;
}

/* ---------------- Actions ---------------- */
function handleLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get("email").trim().toLowerCase();
  const password = fd.get("password");
  const user = db.users.find(u => u.email.toLowerCase() === email && u.password === password);
  if (!user) {
    document.getElementById("app").innerHTML = loginPage("Invalid email or password.");
    return;
  }
  setSession(user);
  navigate("#/dashboard");
}

function handleSignup(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get("email").trim().toLowerCase();
  if (db.users.find(u => u.email.toLowerCase() === email)) {
    document.getElementById("app").innerHTML = signupPage("An account with this email already exists.");
    return;
  }
  const user = {
    id: "u" + (db.users.length + 1) + "_" + Date.now(),
    role: fd.get("role"),
    fullName: fd.get("fullName"),
    email,
    password: fd.get("password"),
    skills: [],
    plan: "free",
    onboarded: false,
    avatar: null,
    wallet: fd.get("role") === "employer" ? 250000 : 5000
  };
  db.users.push(user);
  saveDB();
  setSession(user);
  navigate("#/dashboard");
}

function logout() {
  setSession(null);
  navigate("#/");
}

function goToPayment(planId) {
  const user = currentUser();
  if (!user) return navigate("#/login");
  if (planId === "free") return setPlan("free");
  navigate("#/payment?plan=" + planId);
}

function processPayment(e, planId) {
  e.preventDefault();
  setPlan(planId);
  showToast("Payment successful! Welcome to " + PLANS[planId].name + " 🎉 (demo transaction — no money was actually charged)");
}

function setPlan(planId) {
  const user = currentUser();
  if (!user) return navigate("#/login");
  if (!PLANS[planId]) return;
  user.plan = planId;

  // Employers: featured status follows their plan tier
  if (user.role === "employer") {
    db.jobs.forEach(j => {
      if (j.employerId === user.id) j.featured = planId !== "free";
    });
  }

  saveDB();
  navigate("#/dashboard");
}

function applyToJob(jobId) {
  const user = currentUser();
  if (!user) return navigate("#/login");
  if (db.applications.find(a => a.jobId === jobId && a.studentId === user.id)) return;
  db.applications.push({ id: "a" + Date.now(), jobId, studentId: user.id, status: "applied" });
  saveDB();
  showToast("Application submitted ✓");
  render();
}

function fundEscrow(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const user = currentUser();
  const serviceId = fd.get("serviceId");
  const service = db.services.find(s => s.id === serviceId);
  if (!service) return;
  db.escrow.push({
    id: "e" + Date.now(),
    serviceId: service.id,
    employerId: user.id,
    studentId: service.studentId,
    title: service.title,
    amount: service.price,
    status: "funded",
    createdAt: Date.now()
  });
  saveDB();
  showToast("₦" + service.price + " has been placed into escrow (demo). The freelancer has been notified.");
  render();
}

function releaseEscrow(id) {
  const es = db.escrow.find(e => e.id === id);
  if (!es) return;
  es.status = "released";
  const student = db.users.find(u => u.id === es.studentId);
  if (student) student.wallet = (student.wallet || 0) + es.amount;
  saveDB();
  showToast("Funds released to the freelancer's wallet (demo).");
  render();
}

function withdrawEscrow(id) {
  const es = db.escrow.find(e => e.id === id);
  if (!es) return;
  es.status = "withdrawn";
  saveDB();
  showToast("₦" + es.amount + " has been sent to your bank account (demo).");
  render();
}

function addService(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const user = currentUser();
  db.services.push({
    id: "s" + Date.now(),
    studentId: user.id,
    title: fd.get("title"),
    description: fd.get("description"),
    price: Number(fd.get("price")),
    deliveryDays: Number(fd.get("deliveryDays"))
  });
  saveDB();
  showToast("Service added to your listings.");
  render();
}

function removeService(id) {
  db.services = db.services.filter(s => s.id !== id);
  saveDB();
  showToast("Service removed.");
  render();
}

function toggleWorkerSubcategoryField(categoryValue) {
  const wrap = document.getElementById("worker-subcategory-wrap");
  const select = document.getElementById("job-subcategory-select");
  if (!wrap) return;
  if (categoryValue === "worker") {
    wrap.classList.remove("hidden");
    if (select) select.required = true;
  } else {
    wrap.classList.add("hidden");
    if (select) select.required = false;
  }
}

function addJob(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const user = currentUser();
  const category = fd.get("category");
  db.jobs.push({
    id: "j" + Date.now(),
    employerId: user.id,
    title: fd.get("title"),
    description: fd.get("description"),
    category,
    subcategory: category === "worker" ? (fd.get("subcategory") || "menial") : null,
    location: fd.get("location") || "Not specified",
    remote: fd.get("remote") === "on",
    salary: fd.get("salary") || "Negotiable",
    featured: !!(user.plan && user.plan !== "free")
  });
  saveDB();
  showToast("Job posted successfully.");
  render();
}

function removeJob(id) {
  db.jobs = db.jobs.filter(j => j.id !== id);
  db.applications = db.applications.filter(a => a.jobId !== id);
  saveDB();
  showToast("Job posting removed.");
  render();
}

function updateProfile(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const user = currentUser();
  user.university = fd.get("university");
  user.course = fd.get("course");
  user.phone = fd.get("phone");
  user.location = fd.get("location");
  user.bio = fd.get("bio");
  user.skills = fd.get("skills").split(",").map(s => s.trim()).filter(Boolean);
  user.experience = fd.get("experience");
  saveDB();
  showToast("Profile saved.");
  render();
}

function updateEmployerProfile(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const user = currentUser();
  user.company = fd.get("company");
  user.industry = fd.get("industry");
  user.phone = fd.get("phone");
  user.location = fd.get("location");
  user.companyDescription = fd.get("companyDescription");
  saveDB();
  showToast("Company profile saved.");
  render();
}

function generateAIResume() {
  const user = currentUser();
  if (!user || user.role !== "student") return;
  if (!(user.plan && user.plan !== "free")) return navigate("#/pricing");
  const out = document.getElementById("ai-resume-output");
  if (!out) return;
  out.classList.remove("hidden");
  out.textContent = "Generating with Betajobs AI...";
  setTimeout(() => {
    out.textContent = generateAIResumeText(user);
  }, 600);
}

function generateJobDescription() {
  const user = currentUser();
  if (!user || user.role !== "employer") return;
  if (!(user.plan && user.plan !== "free")) return navigate("#/pricing");
  const titleInput = document.getElementById("job-title-input");
  const categorySelect = document.getElementById("job-category-select");
  const descTextarea = document.getElementById("job-desc-textarea");
  if (!titleInput || !categorySelect || !descTextarea) return;
  const title = titleInput.value.trim();
  if (!title) {
    alert("Please enter a job title first so the AI knows what to write about.");
    return;
  }
  descTextarea.value = "Generating with Betajobs AI...";
  setTimeout(() => {
    descTextarea.value = generateAIJobDescription(title, categorySelect.value);
  }, 600);
}



function completeOnboarding(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const user = currentUser();
  if (user.role === "student") {
    user.university = fd.get("university");
    user.course = fd.get("course");
    user.phone = fd.get("phone");
    user.location = fd.get("location");
    user.bio = fd.get("bio");
    user.skills = fd.get("skills").split(",").map(s => s.trim()).filter(Boolean);
    user.experience = fd.get("experience");
  } else {
    user.company = fd.get("company");
    user.industry = fd.get("industry");
    user.phone = fd.get("phone");
    user.location = fd.get("location");
    user.companyDescription = fd.get("companyDescription");
  }
  user.onboarded = true;
  saveDB();
  navigate("#/dashboard");
}


/* ---------------- Render / Router ---------------- */
function render() {
  const hash = window.location.hash.split("?")[0] || "#/";
  const scrollToFeatures = hash === "#/features";
  let html = "";
  if (hash === "#/" || hash === "" || scrollToFeatures) html = landingPage();
  else if (hash === "#/login") html = loginPage();
  else if (hash === "#/signup") html = signupPage();
  else if (hash === "#/opportunities") html = opportunitiesPage();
  else if (hash === "#/pricing") html = pricingPage();
  else if (hash === "#/dashboard") html = dashboardPage();
  else if (hash === "#/onboarding") html = onboardingPage();
  else if (hash === "#/payment") html = paymentPage();
  else if (hash === "#/escrow") html = escrowPage();
  else if (hash === "#/chat") html = chatPage();
  else html = landingPage();

  if (hash === "#/chat") {
    setTimeout(() => {
      const t = document.getElementById("chat-thread");
      if (t) t.scrollTop = t.scrollHeight;
    }, 0);
  }

  if (html) document.getElementById("app").innerHTML = html;

  if (scrollToFeatures) {
    const el = document.getElementById("features");
    if (el) el.scrollIntoView({ behavior: "smooth" });
  } else {
    window.scrollTo(0, 0);
  }

  const mobileNav = document.getElementById("mobile-nav");
  if (mobileNav) mobileNav.classList.add("hidden");
}
</script>
</body>
</html>
